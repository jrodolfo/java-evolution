name: links

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - CONTRIBUTING.md
      - SECURITY.md
      - CHANGELOG.md
      - .lychee.toml
      - .github/workflows/links.yml
      - docs/**
      - src/main/java/**/README.md
  pull_request:
    branches:
      - main
    paths:
      - README.md
      - CONTRIBUTING.md
      - SECURITY.md
      - CHANGELOG.md
      - .lychee.toml
      - .github/workflows/links.yml
      - docs/**
      - src/main/java/**/README.md
  workflow_dispatch:

concurrency:
  group: links-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  markdown-links:
    name: markdown links
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config .lychee.toml README.md "docs/**/*.md" "src/main/java/**/README.md"
          fail: true

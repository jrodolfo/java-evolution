name: build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: maven test
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: set up jdk 25
        uses: actions/setup-java@v5
        with:
          distribution: oracle
          java-version: '25'
          cache: maven

      - name: audit documentation navigation
        run: make docs-audit

      - name: run tests
        run: make test

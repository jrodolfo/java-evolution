name: build

on:
  push:
    branches:
      - main
      - java-27
  pull_request:
    branches:
      - main

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: maven test (${{ matrix.os }}, jdk 27)
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: set up jdk 27
        uses: actions/setup-java@v5
        with:
          distribution: oracle
          java-version: '27'
          cache: maven

      - name: run local check target
        run: make check
